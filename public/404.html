<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina no encontrada | CSTM Software</title>
    <meta name="robots" content="noindex">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
        .wrap{max-width:480px}
        .code{font-size:8rem;font-weight:900;background:linear-gradient(135deg,#f59e0b,#a855f7,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
        h1{font-size:1.5rem;margin:16px 0 12px}
        p{color:#94a3b8;line-height:1.6;margin-bottom:32px}
        .btn{display:inline-block;background:#f59e0b;color:#000;font-weight:700;padding:14px 32px;border-radius:12px;text-decoration:none;font-size:1rem;transition:all .2s}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,158,11,.3)}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>Esta pagina no existe</h1>
        <p>La buscaste o la movesiste. Volve al inicio y encontra lo que necesitas.</p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
